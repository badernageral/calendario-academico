name: Build Desktop (Windows)

# Gera o instalador Windows do Calendário Acadêmico sem você precisar de uma
# máquina Windows. Dispare manualmente (aba Actions → Run workflow) ou
# empurrando uma tag v*.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # necessário para anexar o .exe à Release (em tags)

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      PHP_ZIP: php-8.3.33-Win32-vs16-x64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── PHP portátil (Thread Safe x64) ──────────────────────────
      - name: Baixar e extrair o PHP portátil
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            "https://downloads.php.net/~windows/releases/$env:PHP_ZIP",
            "https://downloads.php.net/~windows/releases/archives/$env:PHP_ZIP"
          )
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile php.zip; $ok = $true; break } catch { Write-Host "falhou: $u" }
          }
          if (-not $ok) { throw "Não consegui baixar o PHP ($env:PHP_ZIP)" }
          Expand-Archive php.zip -DestinationPath desktop/runtime/php -Force
          Copy-Item desktop/php.ini desktop/runtime/php/php.ini -Force

      # Conferir pelo próprio PHP vale mais que procurar DLL: no Windows a
      # extensão calendar — a da Páscoa, que baliza os feriados móveis — é
      # compilada dentro do binário e não tem arquivo em ext/.
      - name: Conferir o que a aplicação precisa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $php = 'desktop/runtime/php/php.exe'
          $ini = 'desktop/runtime/php/php.ini'
          & $php -c $ini -r @"
            `$faltando = array_filter(
              ['pdo_sqlite' => extension_loaded('pdo_sqlite'),
               'calendar (easter_date)' => function_exists('easter_date'),
               'mbstring' => function_exists('mb_strtoupper')],
              fn(`$ok) => !`$ok
            );
            if (`$faltando) { fwrite(STDERR, 'faltando: ' . implode(', ', array_keys(`$faltando)) . PHP_EOL); exit(1); }
            echo 'PHP ' . PHP_VERSION . ' com pdo_sqlite, calendar e mbstring' . PHP_EOL;
          "@
          if ($LASTEXITCODE -ne 0) { throw "O PHP portátil não tem o que a aplicação precisa" }

      # ── Build do instalador ─────────────────────────────────────
      - name: Instalar dependências e empacotar
        working-directory: desktop
        shell: pwsh
        run: |
          npm install
          npm run dist

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Academico-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      # ── Em tags v*, anexa o .exe a uma Release ──────────────────
      - name: Anexar à Release (somente em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
