; php.ini do modo desktop (PHP portátil no Windows).
; O extension_dir aponta para a pasta "ext" do PHP portátil.
extension_dir = "ext"

; Banco: SQLite em arquivo, sem servidor.
extension = pdo_sqlite
extension = sqlite3

; Obrigatória: easter_date() calcula a Páscoa, base dos feriados móveis.
extension = calendar

; Opcional, mas recomendada: maiúsculas acentuadas e minúsculas com acento.
extension = mbstring

; O fuso é fixado pela aplicação (America/Araguaina); aqui fica só o padrão
; que vale antes de ela subir.
date.timezone = America/Araguaina

; O servidor embutido é single-thread; o log vai para o stderr, que o Electron
; capta e joga no console.
display_errors = Off
log_errors = On
error_log = php://stderr
